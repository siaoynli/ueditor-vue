<!DOCTYPE html>
<!--
  真机粘贴采集页（语料入库辅助，非组件交付物）
  用法：
    1. 启动 playground（端口 5199），浏览器打开 http://localhost:5199/capture.html
    2. 在 Word/网页中复制目标内容 → 点击采集框 → Ctrl+V
    3. 页面展示 clipboardData.getData('text/html') 原文（只读 textarea，不注入 DOM）
    4. 填语料 id → 点"下载为 paste.html" → 将下载的 <id>.paste.html 内容存为
       tests/fixtures/corpus/<id>/paste.html，并在 manifest.json 增加对应条目
  安全说明：本页不上传任何数据，粘贴内容仅留在浏览器内存与本地下载文件。
-->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>粘贴语料采集</title>
  </head>
  <body>
    <h1>真机粘贴采集</h1>
    <p>
      语料 id：
      <input id="corpus-id" value="word-sample-1" size="30" />
      <button id="download" disabled>下载为 paste.html</button>
    </p>
    <div
      id="paste-target"
      contenteditable="true"
      style="border: 1px solid #999; min-height: 80px; padding: 8px"
      >点击此处后粘贴（Ctrl+V）</div
    >
    <h2>text/html 原文</h2>
    <textarea id="html-out" rows="14" style="width: 100%" readonly placeholder="（无 text/html，可能粘贴的是纯文本）"></textarea>
    <h2>text/plain</h2>
    <textarea id="plain-out" rows="5" style="width: 100%" readonly></textarea>
    <script>
      (function () {
        var target = document.getElementById('paste-target');
        var htmlOut = document.getElementById('html-out');
        var plainOut = document.getElementById('plain-out');
        var downloadBtn = document.getElementById('download');
        var idInput = document.getElementById('corpus-id');

        // preventDefault 阻止浏览器把 HTML 真插进 contenteditable：
        // 采集只取 clipboardData 原文，页面自身不渲染不可信内容
        target.addEventListener('paste', function (e) {
          var dt = e.clipboardData;
          if (!dt) return;
          e.preventDefault();
          var html = dt.getData('text/html');
          htmlOut.value = html;
          plainOut.value = dt.getData('text/plain');
          downloadBtn.disabled = !html;
          if (!html) {
            htmlOut.placeholder = '本次粘贴无 text/html 数据';
          }
        });

        downloadBtn.addEventListener('click', function () {
          var blob = new Blob([htmlOut.value], { type: 'text/html;charset=utf-8' });
          var a = document.createElement('a');
          // id 只用作文件名：过滤路径字符，防下载名越界
          var id = (idInput.value || 'sample').replace(/[^A-Za-z0-9._-]/g, '-');
          a.href = URL.createObjectURL(blob);
          a.download = id + '.paste.html';
          a.click();
          URL.revokeObjectURL(a.href);
        });
      })();
    </script>
  </body>
</html>
